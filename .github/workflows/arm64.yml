name: arm64

# Builds the plugin the way it ships (pnpm build into the committed dist/), checks the committed dist/ is current,
# checks the backend and installer scripts parse, and packages the plugin folder NSLPluginInstaller.sh unpacks.

on:
  push:
    branches: [arm64]
    tags: ['arm64-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Committed dist/ matches the build
        run: git diff --exit-code --stat -- dist

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Backend and installer syntax
        run: |
          python -m compileall -q main.py settings.py py_modules
          bash -n NonSteamLaunchers.sh
          bash -n NonSteamLaunchers-arm64.sh

      - name: Package plugin
        run: |
          mkdir -p out/NonSteamLaunchers
          cp -r dist assets py_modules main.py settings.py plugin.json package.json LICENSE README.md \
            NonSteamLaunchers.sh NonSteamLaunchers-arm64.sh out/NonSteamLaunchers/
          find out -name __pycache__ -prune -exec rm -rf {} +
          (cd out && zip -qr NonSteamLaunchers.zip NonSteamLaunchers)

      - uses: actions/upload-artifact@v4
        with:
          name: NonSteamLaunchers-plugin
          path: out/NonSteamLaunchers.zip

  release:
    if: startsWith(github.ref, 'refs/tags/arm64-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NonSteamLaunchers-plugin

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" NonSteamLaunchers.zip -R "$GITHUB_REPOSITORY" --prerelease \
            --title "NonSteamLaunchersDecky arm64 $GITHUB_REF_NAME" \
            --notes "arm64 build of the NonSteamLaunchers Decky plugin. NSLPlugin.desktop from the NonSteamLaunchers arm64 release installs it."
